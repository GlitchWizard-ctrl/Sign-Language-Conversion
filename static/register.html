<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sign Call — Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-zNHRP3r2xzdtC3VwQf1n8EA5dM2z4Jm2cqTZ+q+K5f6s0w3KkW6MkA9zW7rJfEEdE2mLh6h6v7E2o4e6hjGw1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <section class="auth-panel glass-panel auth-panel-wide">
            <div class="brand-mark">
                <i class="fa-solid fa-hands-asl-interpreting"></i>
            </div>
            <h1>Create your account</h1>
            <p>Start a live video call with sign language conversion and optional interpreter mode.</p>

            <div id="alertMessage" class="alert-message alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="alertText">Something went wrong.</span>
            </div>
            <div id="successMessage" class="alert-message alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span id="successText">Account created! Redirecting to login...</span>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" class="form-input" placeholder="Full name" required>
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="Email address" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm password" required>
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="login-btn">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-footer">
                Already registered? <a href="login.html">Sign in here</a>
            </div>
        </section>
    </div>

    <script src="register.js"></script>
</body>
</html>
